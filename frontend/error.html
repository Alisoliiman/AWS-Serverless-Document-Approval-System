<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found - Error</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .error-container {
            text-align: center;
            padding: 50px 20px;
        }
        .error-container h1 {
            font-size: 5rem;
            color: var(--accent-color);
            margin-bottom: 10px;
        }
        .error-container p {
            color: var(--text-muted);
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="app-container error-container">
        <div class="card">
            <h1>404</h1>
            <h2>Page Not Found</h2>
            <p>The page you are looking for does not exist or has been moved.</p>
            <a href="index.html" class="btn primary-btn" style="display:inline-block; text-decoration:none; width:auto; padding: 10px 20px;">Back to Home</a>
        </div>
        <footer>
            <p>Project #5 - Ali Soliman</p>
        </footer>
    </div>
</body>
</html>
